 const chips=MAPS.map((n,i)=>`<b data-node="${i}" class="${i===c?'on':''}" style="flex:none;padding:10px 12px;${i>sv.un?'opacity:.5':''}">${i>sv.un?'🔒':''} ${i+1}. ${n.n}</b>`).join(''),dn=S.filter(x=>sv.cl[c+'-'+x.i]).length;
 info('BẢN ĐỒ',`<div class="tabs" style="overflow:auto">${chips}</div><div style="text-align:center;margin:2px 0 6px"><b style="color:#ffd978">CHƯƠNG ${c+1} — ${m.n.toUpperCase()}</b><br><small>${m.d} · ${dn}/${S.length} màn${c>sv.un?' · 🔒 Hạ Boss chương trước để mở':''}</small></div>
 <svg viewBox="0 0 300 420" width="100%" style="border:1px solid #6b5326;border-radius:12px;background:linear-gradient(hsl(${m.h},38%,24%),hsl(${m.h+20},32%,9%))">${ed}${nd}</svg>`);
 sv.nw=sv.nw.filter(k=>!k.startsWith(c+'-')&&k!=='c'+c)}

 if(evTab==='bx')return'<div style="margin-top:8px">'+board(e).slice(0,10).map((x,i)=>`<div class="row" style="${x.me?'color:#ffd978;font-weight:800':''}"><span>#${i+1} ${x.n}</span><b>${x.v.toLocaleString('vi')}</b></div>`).join('')+'</div>';
 if(evTab==='ov'&&!['login','wheel','boss'].includes(e.ty))return'<div class="panel" style="margin:8px 0;font-size:13px">Tích luỹ tiến độ để nhận thưởng ở tab Nhiệm vụ. Token dùng đổi quà ở tab Phần thưởng.'+(e.id==='fe'?'<br>🔥 Ải Sự kiện xuất hiện trên bản đồ trong thời gian này.':'')+'</div>';return''}

 let ev=0,wel=0,wb=0;for(const e of EVC()){if(!evAct(e))continue;const k=pk(e);if(e.ty==='login'&&sv.ev.lg.l!==dk())wel=1;if(e.ty==='wheel'&&sv.ev.wh!==dk())ev++;if(e.ty==='boss')wb=1;if(e.ms)e.ms.forEach((m,i)=>{if((sv.ev.p[k]||0)>=m[0]&&!(sv.ev.c[k]||{})[i])ev++})}
 let bp=0;for(let l=1;l<=lvB();l++){if(!sv.bp.cf[l])bp++;if(sv.bp.pm&&!sv.bp.cp[l])bp++}return{qst:qn,ev,wel,wb,bp,sm:sv.fd!==dk()?1:0}}

 document.querySelectorAll('[data-b]').forEach(u=>{const n=B[u.dataset.b]||0;u.textContent=n>9?'9+':n;u.style.display=n?'grid':'none';u.parentNode.classList.toggle('has',!!n)})}
{const h=$('#hhero'),im=h.firstElementChild;im.onerror=()=>{im.outerHTML=HEROSVG};h.onclick=()=>{if(h.classList.contains('atk'))return;h.classList.add('atk');sfx('s');setTimeout(()=>h.classList.remove('atk'),700)}}

 char:()=>renderChar(),hero:()=>renderHero(),sum:()=>renderSummon(),ev:()=>{evSel='';renderEvents()},bp:()=>renderBP(),bxh:()=>renderBXH(),qst:()=>renderQuest(),
 skill:()=>renderSkill('Tấn Công'),

 gear:()=>renderUp(),inv:()=>renderInv(),ach:()=>renderAch(),
 set:()=>renderSet(),wel:()=>{evSel='lg';evTab='ov';renderEvents()},wbos:()=>{evSel='wb';evTab='ov';renderEvents()},wf:()=>{if(sv.afk||(Date.now()-(sv.ls||0))/1000>=AFK.minS)afkCheck();else toast('Chưa có phúc lợi ngoại tuyến')},shop:()=>renderShop(),more:()=>renderMore(),home:()=>{$('#modal').classList.remove('on');home()}
};
