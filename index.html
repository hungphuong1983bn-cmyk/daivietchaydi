 heroInfo:id=>{const H=sv.hx[id]||{l:1,e:0},cap=PG.heroCap(H.s||0),max=H.l>=cap,need=max?0:M.max(0,hexp(H.l)-H.e),b=asHero(id,bon),pw=asHero(id,pwr),
   rs=ORD7.split('').map(k=>eqiH(id,k)).filter(Boolean).map(i=>i.r),sl=UPG?UPG.runeSlots(H.l):0,r=rnOf(id);
  return{l:H.l,exp:H.e,expNext:hexp(H.l),cap,max,star:H.s||0,need,cost:M.ceil(need/trainRt()),b,pw,sel:sv.hs===id,eqN:rs.length,
   setN:UPG?UPG.setBonus(rs).list.filter(S=>S.tiers.some(t=>t.on)).length:0,vhN:Object.keys(vhOf(id)).length,vhT:VH.reduce((a,b)=>a+b.n.length,0),rnN:r.eq.slice(0,sl).filter(Boolean).length,rnS:sl}},
 setInfo:id=>UPG?UPG.setBonus(ORD7.split('').map(k=>eqiH(id,k)).filter(Boolean).map(i=>i.r)).list:null,
 levelUp:(id,all)=>{const H=sv.hx[id]||(sv.hx[id]={l:1,e:0});let n=0;
  for(;;){if(H.l>=PG.heroCap(H.s||0))break;const need=M.max(0,hexp(H.l)-H.e),cost=M.ceil(need/trainRt());if(sv.gold<cost){if(!n)toast('Thiếu 🪙 Vàng ('+sv.gold+'/'+cost+')');break}
   sv.gold-=cost;evc('spent',cost);const l0=H.l;H.e+=need;hxUp(H);n+=H.l-l0;if(!all)break}
  if(n){qc('ups',1);put();sfx('u')}else if(H.l>=PG.heroCap(H.s||0))toast('Đã đạt trần cấp — tăng ★ để mở thêm');return n},
 profile:id=>{if(CH)CH.open(id)},pick:id=>{sv.hs=id;put();sfx('u')},close:()=>home(),
 equip:(id,u)=>{const i=sv.inv.find(x=>x.u===u);if(!i)return;const o=owner(u),oh=o&&o!==id?HEROES.find(h=>h.id===o):null;asHero(id,()=>equipItem(i));put();sfx('u');if(oh)toast('Đã chuyển từ '+oh.n)},
 unequip:(id,k)=>{delete eqOf(id)[k];put();sfx('u')},
 auto:id=>{let n=0;for(const k of ORD7){let best=null;for(const i of sv.inv){if(i.s!==k)continue;const o=owner(i.u);if(o&&o!==id)continue;if(!best||pv(i)>pv(best))best=i}const cu=eqiH(id,k);if(best&&(!cu||(cu!==best&&pv(best)>pv(cu)))){eqOf(id)[k]=best.u;n++}}put();if(n)sfx('u');toast(n?'Đã mặc '+n+' món tốt nhất':'Đã là bộ tốt nhất có thể')},
 upgrade:u=>{const i=sv.inv.find(x=>x.u===u);if(!i)return;const c=upCost(i);if(sv.gold>=c&&i.l<10){sv.gold-=c;evc('spent',c);i.l++;qc('ups',1);sv.st.maxUp=M.max(sv.st.maxUp,i.l);put();sfx('u')}else toast(i.l>=10?'Đã tối đa':'Thiếu 🪙 Vàng')},
 refine:u=>{const i=sv.inv.find(x=>x.u===u);if(!i)return;if((i.rf||0)<5&&(sv.mt||0)>=rfc(i)&&sv.gold>=rfg(i)){sv.mt-=rfc(i);evc('spent',rfg(i));sv.gold-=rfg(i);i.rf=(i.rf||0)+1;qc('ups',1);put();sfx('u')}else toast((i.rf||0)>=5?'Đã tinh luyện tối đa':'Thiếu ⚙ Tinh thiết / 🪙 Vàng')},
 sellItem:u=>{const i=sv.inv.find(x=>x.u===u);if(!i)return;if(owner(u))return toast('Đang được tướng mặc — hãy tháo trước');sv.gold+=sell(i);sv.inv=sv.inv.filter(x=>x!==i);put();sfx('u')},
 learn:(id,vid)=>asHero(id,()=>{if(!learnVH(vid))toast('Chưa đủ điều kiện / thiếu 🪙 Vàng')}),
 runeUp:(id,k)=>{const R=UPG.rune,r=rnOf(id),l=r.lv[k]|0,c=R.cost[l];if(!UPG.rt(k)||l>=R.maxLv)return;if(sv.gold<c.g||(sv.mt||0)<c.t)return toast('Thiếu 🪙 Vàng / ⚙ Tinh thiết');sv.gold-=c.g;evc('spent',c.g);sv.mt-=c.t;r.lv[k]=l+1;qc('ups',1);put();sfx('u')},
 runeSet:(id,k)=>{const r=rnOf(id),ns=UPG.runeSlots(hlOf(id));if(!(r.lv[k]|0))return;if(r.eq.includes(k))return;const i=r.eq.slice(0,ns).findIndex(x=>!x);if(i<0)return toast('Hết ô Phù Văn — tháo bớt hoặc nâng cấp tướng để mở ô');r.eq[i]=k;put();sfx('u')},
 runeOff:(id,k)=>{const r=rnOf(id);r.eq=r.eq.map(x=>x===k?null:x);put();sfx('u')},runeTake:(id,i)=>{rnOf(id).eq[i]=null;put();sfx('u')},
 badge:(t,id)=>{const i=UPX.heroInfo(id);if(t==='hero')return!i.max&&sv.gold>=i.cost;
  if(t==='gear')return ORD7.split('').some(k=>{const it=eqiH(id,k);return it?it.l<10&&sv.gold>=upCost(it):sv.inv.some(x=>x.s===k&&!owner(x.u))});
  if(t==='mart'){const V=vhOf(id);return VH.some(b=>{let j=0;while(j<b.n.length&&V[b.k+j])j++;return j<b.n.length&&sv.gold>=b.n[j].c})}
  if(t==='rune'){const R=UPG.rune,r=rnOf(id);return R.types.some(x=>{const l=r.lv[x.k]|0;return l<R.maxLv&&sv.gold>=R.cost[l].g&&(sv.mt||0)>=R.cost[l].t})}return false}};

 const mx=CH?CH.isMax(id):false,cost=h.gc?'🎴 Triệu hồi':h.m?'💎 '+h.m:'🪙 '+h.g;

  eq:ORD7.split('').map(k=>{const it=eqiH(id,k);return{i:SLOT[k].i,n:it?it.n:'Trống'}}),cost,buy:!!(h.m||h.g)&&!h.gc}};
